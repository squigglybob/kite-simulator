<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lofi — experiment</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f14; color: #d7e3ec;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { display: flex; align-items: stretch; overflow: hidden; }

      #stage { flex: 1; min-width: 0; display: grid; place-items: center; padding: 20px; }
      #stage > div { width: 300px; }

      h1 { font-size: 12px; font-weight: normal; color: #7fb2d9; margin: 0 0 16px;
        text-transform: uppercase; letter-spacing: 0.08em; }
      button { padding: 12px; cursor: pointer; background: #1b2430; color: #d7e3ec;
        border: 1px solid #2b3440; font: inherit; letter-spacing: 0.06em; }
      button:hover { background: #23303f; }
      #toggle { width: 100%; text-transform: uppercase; padding: 15px; }
      dl { display: grid; grid-template-columns: 74px 1fr; gap: 1px 10px; margin: 16px 0 0; }
      dt { color: #5f7183; }
      dd { margin: 0; }
      a { color: #7fb2d9; }
      .row { display: flex; gap: 6px; margin-top: 12px; }
      .row button { flex: 1; font-size: 11px; padding: 8px; }

      #panel { flex: 0 0 290px; height: 100vh; overflow-y: auto;
        padding: 12px 14px 60px; box-sizing: border-box;
        background: rgba(14, 17, 23, 0.94); border-left: 1px solid #2b3440; }
      #panel h2 { font-size: 11px; margin: 16px 0 6px; color: #7fb2d9;
        text-transform: uppercase; letter-spacing: 0.08em; }
      #panel h2:first-child { margin-top: 0; }
      label { display: block; margin-bottom: 7px; }
      label span { display: flex; justify-content: space-between; color: #93a6b8; }
      label b { font-weight: normal; color: #d7e3ec; }
      input[type=range] { width: 100%; margin: 1px 0 0; accent-color: #7fb2d9; height: 14px; }
      select { width: 100%; padding: 6px; background: #1b2430; color: #d7e3ec;
        border: 1px solid #2b3440; font: inherit; }
      #panel .row { margin: 6px 0 0; }
      #panel .row button { padding: 6px; font-size: 11px; }
      #panel .row button:disabled { opacity: 0.4; cursor: default; }
      .feel { color: #5f7183; margin: 6px 0 8px; font-size: 11px; }
      .chords { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; }
      .chord { display: flex; align-items: center; gap: 5px; margin: 0; }
      .chord input { accent-color: #7fb2d9; margin: 0; }
      /* Faders that cannot touch a note already sounding, only the next chord. */
      .later span::after { content: ' \21bb'; color: #5f7183; }
      .note { color: #5f7183; margin: 14px 0 0; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div>
        <h1>Lofi generator</h1>
        <button id="toggle" type="button">Play</button>
        <dl>
          <dt>seed</dt><dd id="seed">&mdash;</dd>
          <dt>elapsed</dt><dd id="elapsed">0:00</dd>
          <dt>chord</dt><dd id="chord">&mdash;</dd>
          <dt>section</dt><dd id="section">&mdash;</dd>
        </dl>
        <div class="row">
          <button id="reseed" type="button">New seed</button>
          <button id="copy" type="button">Copy preset</button>
          <button id="reset" type="button">Reset</button>
        </div>
        <p class="note">&#8635; marks faders that apply from the next chord.<br />
          Everything else lands on the notes already ringing.</p>
      </div>
    </div>
    <div id="panel"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
