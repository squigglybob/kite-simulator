<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import { createChain } from './fx.ts'
import { defaultParams } from './params.ts'
const send = (t) => { new Image().src = 'http://localhost:5200/?r=' + encodeURIComponent(t) }
window.onerror = (m) => send('onerror: ' + m)

const SR = 22050, SECS = 120, HOP = 0.05

// A steady tone straight into the pad bus. No scheduler, so an offline render is exact.
async function run(patch, measure) {
  const ctx = new OfflineAudioContext(1, SR * SECS, SR)
  const params = { ...defaultParams(), ...patch }
  const chain = createChain(ctx, ctx.destination, params, 1)
  chain.setGain(1, 0, 0.001)
  chain.setHiss(0)
  const osc = ctx.createOscillator()
  osc.type = 'sawtooth'
  osc.frequency.value = 220
  const level = ctx.createGain()
  level.gain.value = 0.25
  osc.connect(level); level.connect(chain.pad); osc.start()
  const buf = await ctx.startRendering()
  return measure(buf.getChannelData(0))
}

const envelope = (d, filter) => {
  const step = Math.floor(SR * HOP), out = []
  let prev = 0
  for (let i = 0; i + step < d.length; i += step) {
    let s = 0
    for (let j = i; j < i + step; j++) {
      let v = d[j]
      if (filter === 'high') { const lp = prev + 0.15 * (v - prev); v = v - lp; prev = lp }
      s += v * v
    }
    out.push(Math.sqrt(s / step))
  }
  return out
}

// Period from mean crossings; depth from the extremes, both after the LFO has settled.
function analyse(env) {
  const from = Math.floor(10 / HOP)
  const e = env.slice(from)
  const mean = e.reduce((a, b) => a + b, 0) / e.length
  let crossings = 0
  for (let i = 1; i < e.length; i++) if ((e[i - 1] - mean) * (e[i] - mean) < 0) crossings++
  const lo = Math.min(...e), hi = Math.max(...e)
  return { period: crossings ? (2 * e.length * HOP) / crossings : Infinity, lo, hi,
           db: 20 * Math.log10(hi / Math.max(lo, 1e-9)) }
}

try {
  send('VOLUME LFO  (expect period = the set value, depth ~ -20log10(1-d))')
  for (const [depth, seconds] of [[0, 26], [0.35, 26], [0.35, 12], [0.7, 26]]) {
    const r = await run({ padLfoDepth: depth, padLfoSeconds: seconds, padFilterLfoDepth: 0 },
                        (d) => analyse(envelope(d)))
    send(`  depth ${depth.toFixed(2)} period ${String(seconds).padStart(3)}s -> measured ${r.period.toFixed(1)}s  swing ${r.db.toFixed(1)} dB  (expected ${depth ? (-20*Math.log10(1-depth)).toFixed(1) : '0.0'} dB)`)
  }
  send('FILTER LFO  (volume LFO off; measuring high-frequency energy)')
  for (const [depth, seconds] of [[0, 37], [0.3, 37], [0.6, 20]]) {
    const r = await run({ padLfoDepth: 0, padFilterLfoDepth: depth, padFilterLfoSeconds: seconds },
                        (d) => analyse(envelope(d, 'high')))
    send(`  depth ${depth.toFixed(2)} period ${String(seconds).padStart(3)}s -> measured ${r.period.toFixed(1)}s  swing ${r.db.toFixed(1)} dB`)
  }
  send('DONE')
} catch (e) { send('THREW: ' + (e && e.stack || e)) }
</script></body></html>
